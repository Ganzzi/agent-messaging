[tool.poetry]
name = "agent-messaging"
version = "0.4.0"
description = "Python SDK for AI agent communication with messaging protocol"
authors = ["Ganzzi <boinguyen9701@gmail.com>"]
maintainers = ["Ganzzi <boinguyen9701@gmail.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/ganzzi/agent-messaging"
repository = "https://github.com/ganzzi/agent-messaging"
documentation = "https://agent-messaging.readthedocs.io/"
keywords = [
    "ai",
    "agents",
    "messaging",
    "communication",
    "async",
    "postgresql",
    "sdk",
    "conversations",
    "meetings",
    "one-way",
    "synchronous",
    "asynchronous",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
packages = [{ include = "agent_messaging" }]
include = ["CHANGELOG.md", "LICENSE", "README.md"]
exclude = [
    "tests/",
    "docs/",
    "examples/",
    ".github/",
    ".env*",
    "*.pyc",
    "__pycache__/",
]

[tool.poetry.dependencies]
python = "^3.11"
psqlpy = "^0.11.0"
pydantic = "^2.0"
pydantic-settings = "^2.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "psqlpy>=0.11.6",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.14.0",
    "python-dotenv>=1.1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast tests without external infrastructure",
    "integration: tests requiring external infrastructure",
    "performance: performance and load tests",
    "e2e: end-to-end tests",
    "slow: tests that take longer than 1 second",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
addopts = "--ignore=scripts --strict-markers --strict-config --disable-warnings --tb=short -v --cov=agent_messaging --cov-report=term-missing --cov-report=html:htmlcov --cov-report=xml"
norecursedirs = ["scripts", "examples", "docs"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"
